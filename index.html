<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Présence terrain — RD Congo</title>
<meta name="description" content="Carte interactive du staff, des projets et des partenaires par province en République Démocratique du Congo.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  :root{
    --ink:        #0d1420;
    --panel:      #131c2b;
    --panel-2:    #17223405;
    --line:       #263248;
    --text:       #e8edf7;
    --muted:      #8ea0bd;
    --gold:       #f2c14e;
    --gold-dim:   #d7ac48;
    --bin-1:      #f6c98a;
    --bin-2:      #f0a34a;
    --bin-3:      #e0791f;
    --bin-4:      #b8501f;
    --radius-lg:  18px;
    --radius-md:  12px;
    --radius-sm:  8px;
    --sidebar-w:  340px;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{ height:100%; }

  body{
    background: var(--ink);
    color: var(--text);
    font-family:'Inter', -apple-system, sans-serif;
    overflow:hidden;
  }

  .app{
    display:grid;
    grid-template-rows: auto 1fr;
    grid-template-columns: 1fr;
    height:100vh;
  }

  /* ---------- HEADER ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:14px 20px;
    background: linear-gradient(180deg, #131c2b, #101827);
    border-bottom:1px solid var(--line);
    z-index:1200;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
  }
  .brand-mark{
    width:36px; height:36px;
    border-radius:10px;
    background: linear-gradient(135deg, var(--gold), var(--bin-3));
    display:flex; align-items:center; justify-content:center;
    font-size:18px;
    flex-shrink:0;
  }
  .brand-text h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:16px;
    font-weight:600;
    letter-spacing:0.2px;
    white-space:nowrap;
  }
  .brand-text p{
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
  }
  .stats{
    display:flex;
    gap:22px;
  }
  .stat{ text-align:right; }
  .stat b{
    display:block;
    font-family:'Space Grotesk', sans-serif;
    font-size:19px;
    color:var(--gold);
    line-height:1.1;
  }
  .stat span{
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.6px;
  }
  .menu-btn{
    display:none;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:var(--radius-sm);
    width:38px; height:38px;
    font-size:16px;
    cursor:pointer;
  }

  /* ---------- LAYOUT ---------- */
  .body-grid{
    display:grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    min-height:0;
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    background: var(--panel);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .sidebar-inner{
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:14px;
    min-height:0;
    flex:1;
  }
  .search-box{
    position:relative;
  }
  .search-box input{
    width:100%;
    background:#0f1826;
    border:1px solid var(--line);
    color:var(--text);
    border-radius:var(--radius-sm);
    padding:10px 12px 10px 34px;
    font-size:13px;
    font-family:inherit;
    outline:none;
  }
  .search-box input:focus{ border-color: var(--gold-dim); }
  .search-box::before{
    content:"🔍";
    position:absolute;
    left:11px; top:50%;
    transform:translateY(-50%);
    font-size:12px;
    opacity:0.6;
  }

  .legend-chips{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .chip{
    display:flex;
    align-items:center;
    gap:6px;
    background:#0f1826;
    border:1px solid var(--line);
    color:var(--muted);
    border-radius:30px;
    padding:5px 10px 5px 8px;
    font-size:11.5px;
    cursor:pointer;
    transition: border-color .15s, color .15s, background .15s;
  }
  .chip .dot{
    width:9px; height:9px;
    border-radius:50%;
    flex-shrink:0;
  }
  .chip.active{
    border-color: var(--gold-dim);
    color: var(--text);
    background:#1a2436;
  }
  .chip:hover{ color:var(--text); }

  .list-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.6px;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
  }

  .province-list{
    list-style:none;
    overflow-y:auto;
    flex:1;
    display:flex;
    flex-direction:column;
    gap:8px;
    padding-right:4px;
    margin-right:-4px;
  }
  .province-list::-webkit-scrollbar{ width:6px; }
  .province-list::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }

  .province-card{
    background:#0f1826;
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    padding:11px 12px;
    cursor:pointer;
    transition: border-color .15s, transform .1s, opacity .15s;
  }
  .province-card:hover{ border-color: var(--gold-dim); }
  .province-card:active{ transform: scale(0.99); }
  .province-card.dimmed{ opacity:0.32; }
  .pc-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .pc-name{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:600;
    font-size:13.5px;
  }
  .pc-name .dot{
    width:10px; height:10px;
    border-radius:50%;
    flex-shrink:0;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.05);
  }
  .pc-staff{
    font-family:'Space Grotesk', sans-serif;
    font-size:12.5px;
    color:var(--gold);
    background:#1a2436;
    border-radius:20px;
    padding:2px 9px;
    flex-shrink:0;
  }
  .pc-meta{
    margin-top:6px;
    font-size:11.5px;
    color:var(--muted);
    padding-left:18px;
  }

  .empty-state{
    color:var(--muted);
    font-size:12.5px;
    text-align:center;
    padding:30px 10px;
  }

  /* ---------- MAP ---------- */
  .mapwrap{ position:relative; min-height:0; }
  #map{ width:100%; height:100%; background:var(--ink); }

  .reset-btn{
    position:absolute;
    top:14px; left:14px;
    z-index:800;
    background: var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:var(--radius-sm);
    padding:8px 13px;
    font-size:12.5px;
    font-family:inherit;
    font-weight:500;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(0,0,0,0.35);
  }
  .reset-btn:hover{ border-color: var(--gold-dim); }

  /* ---------- POPUP ---------- */
  .leaflet-popup-content-wrapper{
    background: var(--panel);
    color: var(--text);
    border-radius: 14px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.55);
    border:1px solid var(--line);
  }
  .leaflet-popup-tip{ background: var(--panel); }
  .leaflet-popup-content{
    margin:14px 16px;
    font-size:13px;
    line-height:1.5;
    max-height:min(50vh, 420px);
    overflow-y:auto;
    width:320px !important;
  }
  .leaflet-popup-close-button{ color:var(--muted) !important; }

  .popup-title{
    font-family:'Space Grotesk', sans-serif;
    font-size:17px;
    font-weight:600;
    color: var(--gold);
    border-bottom:1px solid var(--line);
    padding-bottom:8px;
    margin-bottom:10px;
  }
  .popup-staff-badge{
    display:inline-block;
    background:#1a2436;
    color: var(--gold);
    padding:3px 12px;
    border-radius:30px;
    font-weight:600;
    font-size:12.5px;
    margin-bottom:12px;
  }
  .popup-section strong{
    display:block;
    color:#9fc4e8;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    margin-bottom:7px;
  }
  .popup-projet{
    background:#0f1826;
    border-left:3px solid var(--gold-dim);
    border-radius:7px;
    padding:6px 9px;
    margin-bottom:6px;
    font-size:12.5px;
  }
  .popup-partner{
    display:inline-block;
    background:#0f1826;
    border:1px solid var(--line);
    border-radius:20px;
    padding:3px 10px;
    margin:2px 4px 2px 0;
    font-size:11.5px;
    color:var(--muted);
  }
  .popup-section{ margin-top:12px; }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 760px){
    .stats{ display:none; }
    .menu-btn{ display:block; }
    .body-grid{ grid-template-columns: 1fr; position:relative; }
    .sidebar{
      position:absolute;
      inset:0 0 0 0;
      z-index:1100;
      width:100%;
      transform: translateX(-100%);
      transition: transform .22s ease;
    }
    .sidebar.open{ transform: translateX(0); }
    .mapwrap{ grid-column: 1; }
  }
</style>
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <button class="menu-btn" id="menuBtn" aria-label="Ouvrir la liste des provinces">☰</button>

  <div class="body-grid">

    <div class="mapwrap">
      <button class="reset-btn" id="resetBtn">↺ Vue d'ensemble RDC</button>
      <div id="map"></div>
    </div>

  </div>
</div>

    { min: 10,  max: 24,       label: "10–25",   radius: 11, color: "#f6c98a" }
  ];
  function binFor(staff){
    return STAFF_BINS.find(b => staff >= b.min && staff <= b.max) || STAFF_BINS[STAFF_BINS.length - 1];
  }

      <div class="popup-section">
        <strong>Partenaires</strong>
        <div>${prov.partenaires.split(';').map(p => `<span class="popup-partner">${p.trim()}</span>`).join('')}</div>
      </div>
    `;
  }

  // marqueurs indexés par nom pour la synchro liste <-> carte
  const markers = {};

  provincesData.forEach(prov => {
    const bin = binFor(prov.staff);
    const marker = L.circleMarker([prov.lat, prov.lng], {
      radius: bin.radius,
      color: '#ffffff',
      weight: 1.5,
      fillColor: bin.color,
      fillOpacity: 0.82,
      opacity: 0.9
    }).addTo(map);

    marker.bindPopup(buildPopup(prov), { className: 'custom-popup', maxWidth: 340, closeButton: true });

    marker.on('mouseover', function(){ this.setStyle({ weight: 3, color: '#f2c14e' }); });
    marker.on('mouseout',  function(){ this.setStyle({ weight: 1.5, color: '#ffffff' }); });

    markers[prov.name] = marker;
  });

  // =========================================================
  // 4. STATISTIQUES D'EN-TÊTE (calculées, jamais tapées à la main)
  // =========================================================
  const totalStaff    = provincesData.reduce((s, p) => s + p.staff, 0);
  const totalProjects = provincesData.reduce((s, p) => s + p.projets.length, 0);
  document.getElementById('stats').innerHTML = `
    <div class="stat"><b>${provincesData.length}</b><span>Provinces</span></div>
    <div class="stat"><b>${totalStaff}</b><span>Staff</span></div>
    <div class="stat"><b>${totalProjects}</b><span>Projets</span></div>
  `;

  // =========================================================
  // 5. LÉGENDE / FILTRE
  // =========================================================
  let activeBin = null;
  const legendEl = document.getElementById('legendChips');
  legendEl.innerHTML = STAFF_BINS.map((b, i) => `
    <div class="chip" data-bin="${i}">
      <span class="dot" style="background:${b.color}"></span>${b.label}
    </div>
  `).join('');

  legendEl.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const idx = chip.getAttribute('data-bin');
      activeBin = (activeBin === idx) ? null : idx;
      legendEl.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.getAttribute('data-bin') === activeBin));
      applyFilters();
    });
  });

  // =========================================================
  // 6. LISTE LATÉRALE + RECHERCHE
  // =========================================================
  const listEl = document.getElementById('provinceList');
  const searchInput = document.getElementById('searchInput');
  const listCount = document.getElementById('listCount');

  function renderList(){
    const query = searchInput.value.trim().toLowerCase();
    let visibleCount = 0;

    listEl.innerHTML = provincesData.map(prov => {
      const bin = binFor(prov.staff);
      const matchesSearch = prov.name.toLowerCase().includes(query);
      const matchesBin = activeBin === null || STAFF_BINS[activeBin] === bin;
      const visible = matchesSearch && matchesBin;
      if (visible) visibleCount++;

      return `
        <li class="province-card ${visible ? '' : 'dimmed'}" data-name="${prov.name}" style="${visible ? '' : 'display:none;'}">
          <div class="pc-top">
            <div class="pc-name"><span class="dot" style="background:${bin.color}"></span>${prov.name}</div>
            <div class="pc-staff">${prov.staff}</div>
          </div>
          <div class="pc-meta">${prov.projets.length} projet(s) · ${prov.partenaires.split(';').length} partenaire(s)</div>
        </li>
      `;
    }).join('');

    listCount.textContent = `${visibleCount}/${provincesData.length}`;

    if (visibleCount === 0){
      listEl.innerHTML = `<div class="empty-state">Aucune province ne correspond à votre recherche.</div>`;
    }

    listEl.querySelectorAll('.province-card').forEach(card => {
      card.addEventListener('click', () => focusProvince(card.getAttribute('data-name')));
    });
  }

  function applyFilters(){
    renderList();
    provincesData.forEach(prov => {
      const bin = binFor(prov.staff);
      const dim = activeBin !== null && STAFF_BINS[activeBin] !== bin;
      markers[prov.name].setStyle({ fillOpacity: dim ? 0.12 : 0.82, opacity: dim ? 0.25 : 0.9 });
    });
  }

  function focusProvince(name){
    const prov = provincesData.find(p => p.name === name);
    if (!prov) return;
    map.flyTo([prov.lat, prov.lng], 7.4, { duration: 0.7 });
    setTimeout(() => markers[name].openPopup(), 650);
    if (window.innerWidth <= 760) sidebar.classList.remove('open');
  }

  searchInput.addEventListener('input', renderList);
  renderList();

  // =========================================================
  // 7. CONTRÔLES : reset vue + menu mobile
  // =========================================================
  document.getElementById('resetBtn').addEventListener('click', () => {
    map.closePopup();
    activeBin = null;
    legendEl.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    applyFilters();
    map.flyTo(DEFAULT_VIEW.center, DEFAULT_VIEW.zoom, { duration: 0.7 });
  });

  const sidebar = document.getElementById('sidebar');
  document.getElementById('menuBtn').addEventListener('click', () => sidebar.classList.toggle('open'));

  setTimeout(() => map.invalidateSize(), 150);

})();
</script>
</body>
</html>
